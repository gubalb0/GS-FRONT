# Blueprint do Render: New > Blueprint > selecione este repositório.
services:
  - type: web
    name: zelo-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai_compat
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: MANAGER_PASSWORD
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false   # ex.: https://zelo-web.onrender.com
  - type: web
    name: zelo-web
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: API_URL
        sync: false   # ex.: https://zelo-api.onrender.com
